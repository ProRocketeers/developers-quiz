<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a4a6a"/></marker></defs>
<rect x="0" y="0" width="800" height="520" fill="#ffffff"/>
<text x="400" y="34" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" font-weight="bold" fill="#26254d">Stakeholder, concern, view a viewpoint</text>
<line x1="262.0" y1="127.0" x2="536.0" y2="127.0" stroke="#4a4a6a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="360" y="117" width="80" height="22" rx="4" fill="#ffffff" stroke="none" stroke-width="0"/><text x="400" y="132" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#26254d">has (má)</text>
<line x1="640.0" y1="328.0" x2="640.0" y2="166.0" stroke="#4a4a6a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="580" y="237" width="120" height="22" rx="4" fill="#ffffff" stroke="none" stroke-width="0"/><text x="640" y="252" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#26254d">addresses (řeší)</text>
<line x1="262.0" y1="367.0" x2="536.0" y2="367.0" stroke="#4a4a6a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="345" y="357" width="110" height="22" rx="4" fill="#ffffff" stroke="none" stroke-width="0"/><text x="400" y="372" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#26254d">governs (řídí)</text>
<line x1="262.0" y1="340.0" x2="536.0" y2="156.0" stroke="#4a4a6a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="328" y="237" width="124" height="22" rx="4" fill="#ffffff" stroke="none" stroke-width="0"/><text x="390" y="252" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#26254d">frames (rámuje)</text>
<rect x="60" y="90" width="200" height="74" rx="8" fill="#fff4c2" stroke="#4a4a6a" stroke-width="1.5"/>
<text x="160" y="120" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="middle" font-weight="bold" fill="#26254d">Stakeholder</text>
<text x="160" y="144" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#26254d">kdo má na systému zájem</text>
<rect x="540" y="90" width="200" height="74" rx="8" fill="#ffe0e0" stroke="#4a4a6a" stroke-width="1.5"/>
<text x="640" y="120" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="middle" font-weight="bold" fill="#26254d">Concern</text>
<text x="640" y="144" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#26254d">zájem, potřeba či obava</text>
<rect x="60" y="330" width="200" height="74" rx="8" fill="#e6e0fa" stroke="#4a4a6a" stroke-width="1.5"/>
<text x="160" y="360" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="middle" font-weight="bold" fill="#26254d">Viewpoint</text>
<text x="160" y="384" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#26254d">šablona: jak se dívat</text>
<rect x="540" y="330" width="200" height="74" rx="8" fill="#d9e8ff" stroke="#4a4a6a" stroke-width="1.5"/>
<text x="640" y="360" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="middle" font-weight="bold" fill="#26254d">View</text>
<text x="640" y="384" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#26254d">zobrazení architektury</text>
<text x="400" y="446" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#26254d">Viewpoint je znovupoužitelná šablona s konvencemi (uložená ve Viewpoint Library).</text>
<text x="400" y="470" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#26254d">View je konkrétní zobrazení architektury vytvořené podle viewpointu;</text>
<text x="400" y="494" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#26254d">jeden view může sloužit více stakeholderům a jejich concerns.</text>
</svg>
