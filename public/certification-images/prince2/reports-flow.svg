<text x="400" y="490" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#26254d" font-style="italic">Řízeno časem = time-driven control (pravidelný interval). Highlight report mohou dostat i další stakeholdeři.</text>
<text x="400" y="510" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#26254d" font-style="italic">Řízeno událostí = event-driven control (vzniká, když něco nastane).</text>
