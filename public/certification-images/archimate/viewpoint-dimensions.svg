  <text x="46" y="126" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="start" fill="#26254d" font-weight="bold">Designing</text>
  <text x="46" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#26254d">architect, software developer,</text>
  <text x="46" y="167" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#26254d">business process designer</text>
  <text x="46" y="186" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#26254d">→ návrh, porovnání variant</text>
  <rect x="30" y="216" width="350" height="104" rx="8" fill="#EEF0FF" stroke="#4a4a6a" stroke-width="1.5"/>
  <text x="46" y="242" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="start" fill="#26254d" font-weight="bold">Deciding</text>
  <text x="46" y="264" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#26254d">manager, CIO, CEO</text>
  <text x="46" y="283" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#26254d">→ podpora rozhodování</text>
  <rect x="30" y="332" width="350" height="104" rx="8" fill="#EEF0FF" stroke="#4a4a6a" stroke-width="1.5"/>
  <text x="46" y="358" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="start" fill="#26254d" font-weight="bold">Informing</text>
  <text x="46" y="380" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#26254d">employee, customer, others</text>
  <text x="46" y="399" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#26254d">→ vysvětlit, přesvědčit,</text>
  <text x="46" y="418" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#26254d">získat závazek</text>
  <rect x="420" y="100" width="350" height="104" rx="8" fill="#EAF6F0" stroke="#4a4a6a" stroke-width="1.5"/>
  <text x="436" y="126" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="start" fill="#26254d" font-weight="bold">Details</text>
  <text x="436" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#26254d">software engineer, process owner</text>
  <text x="436" y="167" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#26254d">→ jedna vrstva a jeden aspekt</text>
  <rect x="420" y="216" width="350" height="104" rx="8" fill="#EAF6F0" stroke="#4a4a6a" stroke-width="1.5"/>
  <text x="436" y="242" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="start" fill="#26254d" font-weight="bold">Coherence</text>
  <text x="436" y="264" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#26254d">operational managers</text>
  <text x="436" y="283" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#26254d">→ více vrstev nebo více aspektů</text>
  <text x="436" y="302" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#26254d">(závislosti, dopad změny)</text>
  <rect x="420" y="332" width="350" height="104" rx="8" fill="#EAF6F0" stroke="#4a4a6a" stroke-width="1.5"/>
  <text x="436" y="358" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="start" fill="#26254d" font-weight="bold">Overview</text>
  <text x="436" y="380" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#26254d">enterprise architect, CIO, CEO</text>
  <text x="436" y="399" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#26254d">→ více vrstev i více aspektů</text>
  <text x="436" y="418" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#26254d">(řízení změn)</text>
  <text x="400" y="470" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#26254d">Viewpoint se klasifikuje ve dvou rozměrech: purpose × content.</text>
