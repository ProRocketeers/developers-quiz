  <rect x="0" y="0" width="800" height="490" fill="#ffffff"/>
  <text x="400" y="32" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" fill="#26254d" font-weight="bold">Mechanismus viewpointů: purpose a content</text>
