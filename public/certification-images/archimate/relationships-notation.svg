<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560">
<rect x="0" y="0" width="800" height="560" fill="#ffffff"/>
<text x="400" y="32" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#26254d">Vztahy v ArchiMate – přehled notace</text>
<rect x="20" y="52" width="370" height="28" rx="4" fill="#e8e8f4"/><text x="30" y="71" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#26254d">Strukturální (Structural)</text>
<path d="M48,112 H130" fill="none" stroke="#26254d" stroke-width="1.8"/><path d="M30,112 L39,106.5 L48,112 L39,117.5 Z" fill="#26254d" stroke="#26254d" stroke-width="1.8" stroke-linejoin="miter"/>
<text x="148" y="108" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#26254d">Composition</text>
<text x="148" y="127" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#26254d">skládá se z částí</text>
<path d="M48,168 H130" fill="none" stroke="#26254d" stroke-width="1.8"/><path d="M30,168 L39,162.5 L48,168 L39,173.5 Z" fill="#ffffff" stroke="#26254d" stroke-width="1.8" stroke-linejoin="miter"/>
<text x="148" y="164" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#26254d">Aggregation</text>
<text x="148" y="183" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#26254d">sdružuje jiné prvky</text>
<path d="M30,224 H119" fill="none" stroke="#26254d" stroke-width="1.8"/><circle cx="33" cy="224" r="3.6" fill="#26254d"/><path d="M130,224 L119,218.5 L119,229.5 Z" fill="#26254d" stroke="#26254d" stroke-width="1.8" stroke-linejoin="miter"/>
<text x="148" y="220" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#26254d">Assignment</text>
<text x="148" y="239" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#26254d">přiděluje odpovědnost, vykonává</text>
<path d="M30,280 H119" fill="none" stroke="#26254d" stroke-width="1.8" stroke-dasharray="2,3"/><path d="M130,280 L119,274.5 L119,285.5 Z" fill="#ffffff" stroke="#26254d" stroke-width="1.8" stroke-linejoin="miter"/>
<text x="148" y="276" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#26254d">Realization</text>
<text x="148" y="295" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#26254d">realizuje abstraktnější prvek</text>
<rect x="20" y="318" width="370" height="28" rx="4" fill="#e8e8f4"/><text x="30" y="337" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#26254d">Dynamické (Dynamic)</text>
<path d="M30,378 H119" fill="none" stroke="#26254d" stroke-width="1.8"/><path d="M130,378 L119,372.5 L119,383.5 Z" fill="#26254d" stroke="#26254d" stroke-width="1.8" stroke-linejoin="miter"/>
<text x="148" y="374" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#26254d">Triggering</text>
<text x="148" y="393" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#26254d">časová či příčinná návaznost</text>
<path d="M30,434 H119" fill="none" stroke="#26254d" stroke-width="1.8" stroke-dasharray="7,4"/><path d="M130,434 L119,428.5 L119,439.5 Z" fill="#26254d" stroke="#26254d" stroke-width="1.8" stroke-linejoin="miter"/>
<text x="148" y="430" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#26254d">Flow</text>
<text x="148" y="449" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#26254d">přenos (dat, zboží, peněz)</text>
<rect x="410" y="52" width="370" height="28" rx="4" fill="#e8e8f4"/><text x="420" y="71" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#26254d">Závislosti (Dependency)</text>
<path d="M420,112 H520" fill="none" stroke="#26254d" stroke-width="1.8"/><path d="M510,106.5 L520,112 L510,117.5" fill="none" stroke="#26254d" stroke-width="1.8" stroke-linejoin="miter"/>
<text x="538" y="108" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#26254d">Serving</text>
<text x="538" y="127" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#26254d">poskytuje funkcionalitu</text>
<path d="M420,168 H520" fill="none" stroke="#26254d" stroke-width="1.8" stroke-dasharray="2,3"/><path d="M510,162.5 L520,168 L510,173.5" fill="none" stroke="#26254d" stroke-width="1.8" stroke-linejoin="miter"/>
<text x="538" y="164" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#26254d">Access</text>
<text x="538" y="183" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#26254d">přístup k pasivnímu prvku</text>
<path d="M420,224 H520" fill="none" stroke="#26254d" stroke-width="1.8" stroke-dasharray="7,4"/><path d="M510,218.5 L520,224 L510,229.5" fill="none" stroke="#26254d" stroke-width="1.8" stroke-linejoin="miter"/><text x="470.0" y="216" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#26254d">+/-</text>
<text x="538" y="220" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#26254d">Influence</text>
<text x="538" y="239" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#26254d">ovlivňuje motivační prvek</text>
<path d="M420,280 H520" fill="none" stroke="#26254d" stroke-width="1.8"/>
<text x="538" y="276" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#26254d">Association</text>
<text x="538" y="295" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#26254d">blíže neurčený vztah</text>
<rect x="410" y="318" width="370" height="28" rx="4" fill="#e8e8f4"/><text x="420" y="337" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#26254d">Ostatní (Other)</text>
<path d="M420,378 H509" fill="none" stroke="#26254d" stroke-width="1.8"/><path d="M520,378 L509,372.5 L509,383.5 Z" fill="#ffffff" stroke="#26254d" stroke-width="1.8" stroke-linejoin="miter"/>
<text x="538" y="374" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#26254d">Specialization</text>
<text x="538" y="393" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#26254d">je zvláštním druhem</text>
<rect x="410" y="416" width="370" height="28" rx="4" fill="#e8e8f4"/><text x="420" y="435" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#26254d">Spojka vztahů (Junction)</text>
<circle cx="440" cy="470" r="7" fill="#26254d"/>
<text x="456" y="475" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#26254d">AND</text>
<circle cx="520" cy="470" r="7" fill="#ffffff" stroke="#26254d" stroke-width="1.8"/>
<text x="536" y="475" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#26254d">OR</text>
<text x="580" y="466" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#26254d">spojuje vztahy</text>
<text x="580" y="484" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#26254d">stejného typu</text>
<text x="20" y="500" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#4a4a6a">Čára směřuje od zdroje (vlevo) k cíli (vpravo).</text>
<text x="20" y="520" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#4a4a6a">Kosočtverec (u celku) i tečka jsou u zdroje,</text>
<text x="20" y="540" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#4a4a6a">šipka u cíle vztahu.</text>
</svg>
