  <text x="400" y="484" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#26254d">Reading: after "Assess request", "Approve request" or "Reject request" is triggered.</text>
  <text x="400" y="528" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#26254d">A junction is not a relationship but a relationship connector – it joins same-type relationships (here triggering).</text>
