<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 570">
<defs><marker id="arr" markerWidth="5" markerHeight="4" viewBox="0 0 10 8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#4a4a6a"/></marker></defs>
<rect x="0" y="0" width="800" height="570" fill="#ffffff"/>
<text x="400" y="32" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" fill="#26254d" font-weight="bold">Risk responses in PRINCE2 7</text>
<text x="150" y="68" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#26254d" font-weight="bold">Threat</text>
<text x="650" y="68" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#26254d" font-weight="bold">Opportunity</text>
<rect x="30" y="82" width="240" height="52" rx="8" fill="#fde3e3" stroke="#4a4a6a" stroke-width="1.5"/>
<text x="150.0" y="113.6" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#26254d" font-weight="bold">Avoid</text>
<rect x="530" y="82" width="240" height="52" rx="8" fill="#e0f3e3" stroke="#4a4a6a" stroke-width="1.5"/>
<text x="650.0" y="113.6" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#26254d" font-weight="bold">Exploit</text>
<text x="400" y="104" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#26254d">remove the uncertainty:</text>
<text x="400" y="122" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#26254d">won't occur / will occur</text>
<rect x="30" y="144" width="240" height="52" rx="8" fill="#fde3e3" stroke="#4a4a6a" stroke-width="1.5"/>
<text x="150.0" y="175.6" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#26254d" font-weight="bold">Reduce</text>
<rect x="530" y="144" width="240" height="52" rx="8" fill="#e0f3e3" stroke="#4a4a6a" stroke-width="1.5"/>
<text x="650.0" y="175.6" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#26254d" font-weight="bold">Enhance</text>
<text x="400" y="166" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#26254d">change the probability</text>
<text x="400" y="184" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#26254d">and/or impact</text>
<rect x="30" y="206" width="740" height="52" rx="8" fill="#f1f1f6" stroke="#4a4a6a" stroke-width="1.5"/>
<text x="45" y="237" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="start" fill="#26254d" font-weight="bold">Transfer</text>
<text x="755" y="237" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="end" fill="#26254d">shift impact to a third party, e.g. insurance</text>
<rect x="30" y="268" width="740" height="52" rx="8" fill="#f1f1f6" stroke="#4a4a6a" stroke-width="1.5"/>
<text x="45" y="299" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="start" fill="#26254d" font-weight="bold">Share</text>
<text x="755" y="299" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="end" fill="#26254d">share gains and losses with a partner as agreed</text>
<rect x="30" y="330" width="740" height="52" rx="8" fill="#f1f1f6" stroke="#4a4a6a" stroke-width="1.5"/>
<text x="45" y="361" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="start" fill="#26254d" font-weight="bold">Accept</text>
<text x="755" y="361" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="end" fill="#26254d">deliberately do nothing; keep monitoring</text>
<rect x="30" y="392" width="740" height="52" rx="8" fill="#f1f1f6" stroke="#4a4a6a" stroke-width="1.5"/>
<text x="45" y="423" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="start" fill="#26254d" font-weight="bold">Prepare contingent plans</text>
<text x="755" y="423" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="end" fill="#26254d">plan prepared in advance, triggered when the risk occurs</text>
<text x="400" y="468" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#26254d" font-style="italic">Transfer, Share, Accept and Prepare contingent plans apply to both threats and opportunities.</text>
<rect x="30" y="486" width="362" height="68" rx="8" fill="#dfe9fb" stroke="#4a4a6a" stroke-width="1.5"/>
<text x="211.0" y="506.9" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#26254d" font-weight="bold">Risk owner</text>
<text x="211.0" y="524.9" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#26254d">accountable for the risk: responses are</text>
<text x="211.0" y="542.9" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#26254d">planned, carried out and effective</text>
<rect x="408" y="486" width="362" height="68" rx="8" fill="#fff3cf" stroke="#4a4a6a" stroke-width="1.5"/>
<text x="589.0" y="506.9" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#26254d" font-weight="bold">Risk action owner</text>
<text x="589.0" y="524.9" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#26254d">carries out the agreed risk</text>
<text x="589.0" y="542.9" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#26254d">responses</text>
</svg>
