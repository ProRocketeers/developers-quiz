<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 530">
<defs><marker id="arr" markerWidth="5" markerHeight="4" viewBox="0 0 10 8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#4a4a6a"/></marker></defs>
<rect x="0" y="0" width="800" height="530" fill="#ffffff"/>
<text x="400" y="32" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" fill="#26254d" font-weight="bold">PRINCE2 7 reports: who, to whom, when</text>
<text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" fill="#26254d" font-weight="bold">Report</text>
<text x="205" y="70" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" fill="#26254d" font-weight="bold">Who → to whom</text>
<text x="455" y="70" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" fill="#26254d" font-weight="bold">When created</text>
<text x="720" y="70" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#26254d" font-weight="bold">Driven by</text>
<rect x="20" y="82" width="760" height="56" rx="8" fill="#f1f1f6" stroke="#4a4a6a" stroke-width="1.5"/>
<text x="30" y="115" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" fill="#26254d" font-weight="bold">Checkpoint report</text>
<text x="205" y="115" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#26254d">Team manager → Project manager</text>
<text x="455" y="106" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#26254d">at intervals per the</text>
<text x="455" y="124" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#26254d">work package description</text>
<rect x="665" y="92" width="110" height="36" rx="18" fill="#dfe9fb" stroke="#4a4a6a" stroke-width="1.5"/>
<text x="720.0" y="114.9" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#26254d" font-weight="bold">time</text>
<rect x="20" y="146" width="760" height="56" rx="8" fill="#ffffff" stroke="#4a4a6a" stroke-width="1.5"/>
<text x="30" y="179" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" fill="#26254d" font-weight="bold">Highlight report</text>
<text x="205" y="179" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#26254d">Project manager → Project Board</text>
<text x="455" y="170" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#26254d">at regular</text>
<text x="455" y="188" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#26254d">intervals</text>
<rect x="665" y="156" width="110" height="36" rx="18" fill="#dfe9fb" stroke="#4a4a6a" stroke-width="1.5"/>
<text x="720.0" y="178.9" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#26254d" font-weight="bold">time</text>
<rect x="20" y="210" width="760" height="56" rx="8" fill="#f1f1f6" stroke="#4a4a6a" stroke-width="1.5"/>
<text x="30" y="243" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" fill="#26254d" font-weight="bold">End stage report</text>
<text x="205" y="243" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#26254d">Project manager → Project Board</text>
<text x="455" y="243" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#26254d">at end of a stage (not the last)</text>
<rect x="665" y="220" width="110" height="36" rx="18" fill="#fff3cf" stroke="#4a4a6a" stroke-width="1.5"/>
<text x="720.0" y="242.9" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#26254d" font-weight="bold">event</text>
<rect x="20" y="274" width="760" height="56" rx="8" fill="#ffffff" stroke="#4a4a6a" stroke-width="1.5"/>
<text x="30" y="307" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" fill="#26254d" font-weight="bold">End project report</text>
<text x="205" y="307" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#26254d">Project manager → Project Board</text>
<text x="455" y="307" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#26254d">when closing the project</text>
<rect x="665" y="284" width="110" height="36" rx="18" fill="#fff3cf" stroke="#4a4a6a" stroke-width="1.5"/>
<text x="720.0" y="306.9" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#26254d" font-weight="bold">event</text>
<rect x="20" y="338" width="760" height="56" rx="8" fill="#f1f1f6" stroke="#4a4a6a" stroke-width="1.5"/>
<text x="30" y="371" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" fill="#26254d" font-weight="bold">Exception report</text>
<text x="205" y="371" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#26254d">Project manager → Project Board</text>
<text x="455" y="362" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#26254d">when a breach of</text>
<text x="455" y="380" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#26254d">tolerance is forecast</text>
<rect x="665" y="348" width="110" height="36" rx="18" fill="#fff3cf" stroke="#4a4a6a" stroke-width="1.5"/>
<text x="720.0" y="370.9" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#26254d" font-weight="bold">event</text>
<rect x="20" y="402" width="760" height="56" rx="8" fill="#ffffff" stroke="#4a4a6a" stroke-width="1.5"/>
<text x="30" y="435" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" fill="#26254d" font-weight="bold">Lessons report</text>
<text x="205" y="435" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#26254d">Project manager → board, organization</text>
<text x="455" y="426" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#26254d">at project end,</text>
<text x="455" y="444" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#26254d">and stages as needed</text>
<rect x="665" y="412" width="110" height="36" rx="18" fill="#fff3cf" stroke="#4a4a6a" stroke-width="1.5"/>
<text x="720.0" y="434.9" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#26254d" font-weight="bold">event</text>
<text x="400" y="490" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#26254d" font-style="italic">Time = time-driven control (regular interval). The highlight report may also go to other stakeholders.</text>
<text x="400" y="510" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#26254d" font-style="italic">Event = event-driven control (arises when something happens).</text>
</svg>
